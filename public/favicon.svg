<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2a8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a1f"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16130c"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#glowGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- 3D Isometric Cube -->
  <g filter="url(#neonGlow)" transform="translate(256, 240)">
    <!-- Top Face -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="#d4af37" opacity="0.95"/>
    <!-- Left Face -->
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="#a8842c" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="104,-60 0,0 0,120 104,60" fill="#8a6a1f" opacity="0.9"/>

    <!-- Inner Core / Camera Aperture -->
    <circle cx="0" cy="0" r="32" fill="#f6f1e7" opacity="0.92"/>
    <circle cx="0" cy="0" r="48" stroke="#f5e2a8" stroke-width="6" fill="none" opacity="0.8"/>
  </g>

  <!-- AR Scanning Ring Glyphs -->
  <path d="M 120,120 L 160,120 M 120,120 L 120,160" stroke="#d4af37" stroke-width="12" stroke-linecap="round"/>
  <path d="M 392,120 L 352,120 M 392,120 L 392,160" stroke="#d4af37" stroke-width="12" stroke-linecap="round"/>
  <path d="M 120,392 L 160,392 M 120,392 L 120,352" stroke="#a8842c" stroke-width="12" stroke-linecap="round"/>
  <path d="M 392,392 L 352,392 M 392,392 L 392,352" stroke="#a8842c" stroke-width="12" stroke-linecap="round"/>
</svg>
